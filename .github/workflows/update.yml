name: Update ETF Data Daily

on:
  schedule:
    # 每個交易日台灣時間 18:30 (UTC 10:30，投信持股公布後) 自動執行
    - cron: '30 10 * * 1-5'
  workflow_dispatch: # 支援在 GitHub 點擊按鈕手動更新

permissions:
  contents: write

jobs:
  update-data:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 安裝套件
        run: pip install requests

      - name: 執行資料生成
        run: python crawler.py

      - name: 提交更新回儲存庫
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git commit -m "Auto-update ETF data [skip ci]" || echo "No changes"
          git push
